[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-inductor-sqlite-patch"
version = "0.1.0"
description = "Automatic SQLite local cache patch for TorchInductor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["packaging>=23"]
license = "BSD-3-Clause"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pytorch_inductor_sqlite_patch = ["upstream.patch", "sqlite_cache.py.txt"]
